[project]
name = "deepl-translator"
version = "0.1.0"
description = "Extract text from txt/docx/pdf, chunk at semantic boundaries, translate EN/DE -> JA via DeepL API"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.35"]

[project.scripts]
deepl-translate = "deepl_translator.cli:main"
deepl-shape = "deepl_translator.cli:shape_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepl_translator"]
